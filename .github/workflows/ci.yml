# CI de qu16-control: tests de backend, tests+build de frontend y validación
# del docker-compose.yml. No usa Docker: los runners no lo necesitan aquí.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancela ejecuciones duplicadas del mismo ref (por ejemplo, pushes seguidos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --include=dev

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  compose:
    name: Validar docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `docker compose config` no está garantizado en el runner; comprobar
      # que el archivo es YAML válido es suficiente para detectar errores de
      # sintaxis y evita depender de Docker en CI.
      - name: Instalar PyYAML
        run: pip install --quiet pyyaml

      - name: Validar YAML del compose
        run: python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"
